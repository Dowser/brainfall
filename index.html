<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TTetris – Tetris med frågesport</title>
    <meta name="description" content="Tetris med en twist: varje rad du fyller blir en snabb frågesportsfråga. Rätt svar rensar raden. Spela gratis i webbläsaren." />
    <meta name="theme-color" content="#07061a" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TTetris – Tetris med frågesport" />
    <meta property="og:description" content="Fyll en rad, svara rätt – annars blir raden kvar. Kan du slå mitt rekord?" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <div id="game" class="game" hidden>
      <aside class="panel left">
        <section class="box">
          <h3 data-i18n="hold"></h3>
          <canvas id="hold"></canvas>
        </section>
        <section class="stats">
          <div class="stat big"><span data-i18n="score"></span><b id="hud-score">0</b></div>
          <div class="stat"><span data-i18n="level"></span><b id="hud-level">1</b></div>
          <div class="stat"><span data-i18n="lines"></span><b id="hud-lines">0</b></div>
          <div class="stat">
            <span data-i18n="streak"></span>
            <b class="pips" id="hud-streak"><i></i><i></i><i></i></b>
          </div>
          <div class="stat dim"><span data-i18n="best"></span><b id="hud-best">0</b></div>
        </section>
      </aside>

      <main class="well">
        <canvas id="board"></canvas>
        <div id="quiz" class="quiz" hidden>
          <div class="quiz-q" id="quiz-q"></div>
          <div class="quiz-opts">
            <button class="opt" data-i="0"><kbd>←</kbd><span></span></button>
            <button class="opt" data-i="1"><span></span><kbd>→</kbd></button>
          </div>
          <div class="quiz-timer"><i id="quiz-timer"></i></div>
        </div>
        <div id="challenge-hud" class="challenge-hud" hidden></div>
      </main>

      <aside class="panel right">
        <section class="box">
          <h3 data-i18n="next"></h3>
          <canvas id="next"></canvas>
        </section>
        <p class="hint" data-i18n="burnHint"></p>
        <div class="sound-chips">
          <button class="chip" id="chip-music" title="M">♪</button>
          <button class="chip" id="chip-sfx" title="S">🔊</button>
        </div>
      </aside>
    </div>

    <div id="menu" class="screen">
      <h1 class="logo" aria-label="TTetris">
        <span style="--c: var(--I)">T</span><span style="--c: var(--T)">T</span><span style="--c: var(--Z)">E</span><span style="--c: var(--O)">T</span><span style="--c: var(--S)">R</span><span style="--c: var(--L)">I</span><span style="--c: var(--J)">S</span>
      </h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <div id="challenge" class="challenge" hidden></div>
      <button id="btn-play" class="btn primary"><span data-i18n="play"></span> <kbd>Enter</kbd></button>
      <div class="row">
        <button id="btn-scores" class="btn" data-i18n="highscores"></button>
        <button id="btn-settings" class="btn" data-i18n="settings"></button>
      </div>
      <div class="langs" id="langs"></div>
      <p class="howto" data-i18n="howTo"></p>
      <p class="keys-help"><span data-i18n="answerKeys"></span> · <span data-i18n="muteKeys"></span></p>
    </div>

    <div id="pause" class="screen modal" hidden>
      <div class="card">
        <h2 data-i18n="paused"></h2>
        <button class="btn primary" data-act="resume" data-i18n="resume"></button>
        <button class="btn" data-act="restart" data-i18n="restart"></button>
        <button class="btn" data-act="quit" data-i18n="quit"></button>
      </div>
    </div>

    <div id="over" class="screen modal" hidden>
      <div class="card">
        <h2 data-i18n="gameOver"></h2>
        <div class="final-score" id="over-score">0</div>
        <div class="badge" id="over-best" data-i18n="newBest" hidden></div>
        <div class="challenge" id="over-challenge" hidden></div>
        <dl class="over-stats" id="over-stats"></dl>
        <button class="btn primary" data-act="again"><span data-i18n="playAgain"></span> <kbd>Enter</kbd></button>
        <button class="btn share" data-act="share" data-i18n="share"></button>
        <button class="btn" data-act="quit" data-i18n="quit"></button>
      </div>
    </div>

    <div id="scores" class="screen modal" hidden>
      <div class="card">
        <h2 data-i18n="highscores"></h2>
        <ol class="score-list" id="score-list"></ol>
        <button class="btn" data-act="close" data-i18n="close"></button>
      </div>
    </div>

    <div id="settings" class="screen modal" hidden>
      <div class="card wide">
        <h2 data-i18n="settings"></h2>
        <div class="setting">
          <label><input type="checkbox" id="set-music" /> <span data-i18n="music"></span></label>
          <input type="range" id="vol-music" min="0" max="1" step="0.05" />
        </div>
        <div class="setting">
          <label><input type="checkbox" id="set-sfx" /> <span data-i18n="sfx"></span></label>
          <input type="range" id="vol-sfx" min="0" max="1" step="0.05" />
        </div>
        <h3 data-i18n="controls"></h3>
        <div class="keymap" id="keymap"></div>
        <div class="row">
          <button class="btn" data-act="reset-keys" data-i18n="resetKeys"></button>
          <button class="btn primary" data-act="close" data-i18n="close"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
